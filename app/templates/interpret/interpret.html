<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080807">
  <title>Interpretar Mensagem — Executive Car SP</title>
  <style>
    :root {
      --bg: #080807; --panel: #10100f; --gold: #d9ad56; --gold-light: #f6d17d;
      --text: #f7f7f5; --muted: #c3c1bd; --line: #38332a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #050505; color: var(--text);
      font-family: Arial, Helvetica, sans-serif; line-height: 1.5;
    }
    .wrap { width: min(100%, 760px); margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; letter-spacing: .04em; color: var(--gold-light); }
    .note {
      background: #171307; border: 1px solid #4b4030; border-radius: 10px;
      color: #c8b184; font-size: 12px; padding: 10px 14px; margin: 10px 0 16px;
    }
    textarea {
      width: 100%; min-height: 180px; resize: vertical;
      background: var(--panel); color: var(--text); border: 1px solid #51432d;
      border-radius: 12px; padding: 14px; font-size: 14px; font-family: inherit;
    }
    button {
      margin-top: 12px; padding: 12px 28px; border-radius: 10px; border: none;
      font-weight: 800; letter-spacing: .05em; cursor: pointer;
      background: linear-gradient(100deg, #f8d17c, #c08a32); color: #171107;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .resultado { margin-top: 22px; }
    .card {
      background: var(--panel); border: 1px solid #51432d; border-radius: 12px;
      padding: 14px 16px; margin: 10px 0;
    }
    .card h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; }
    .linha { font-size: 14px; margin: 4px 0; }
    .linha b { color: var(--gold-light); font-weight: 600; }
    .vazio { color: #8a8680; font-style: italic; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    td { padding: 6px; border-bottom: 1px dashed rgba(179,147,98,.14); vertical-align: top; }
    .erro { background: #2a1210; border: 1px solid #7a2e28; color: #e8a9a2; border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 13px; }
    .pend { list-style: none; padding: 0; margin: 0; font-size: 13px; color: var(--muted); }
    .pend li { padding: 3px 0; }
    .pend li::before { content: "⚠ "; color: var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Interpretar Mensagem</h1>
    <div class="note">Fase de teste — cole a mensagem recebida no WhatsApp/e-mail e clique em Interpretar.
    Nada é salvo: a tela apenas mostra os campos extraídos. (Sem token nesta fase.)</div>

    <textarea id="texto" placeholder="Cole aqui a mensagem do cliente..."></textarea>
    <button id="btn" onclick="interpretar()">✨ Interpretar</button>
    <div id="erro" class="erro" style="display:none"></div>

    <div id="resultado" class="resultado" style="display:none"></div>
  </div>

  <script>
    async function interpretar() {
      const texto = document.getElementById('texto').value.trim();
      const erro = document.getElementById('erro');
      const out = document.getElementById('resultado');
      erro.style.display = 'none';
      out.style.display = 'none';
      if (!texto) { erro.textContent = 'Cole uma mensagem primeiro.'; erro.style.display = 'block'; return; }
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Interpretando...';
      try {
        const resp = await fetch('/r/interpretar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto }),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.erro || 'Erro desconhecido');
        render(data.resultado);
      } catch (e) {
        erro.textContent = e.message;
        erro.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = '✨ Interpretar';
      }
    }

    function render(r) {
      const out = document.getElementById('resultado');
      const vazio = (v) => v ? escapeHtml(String(v)) : '<span class="vazio">—</span>';
      const itens = r.itens || [];
      // Colunas opcionais (origem, destino, passageiros...): só aparecem se algum item tiver valor
      const colunas = [
        ['descricao', 'Serviço'], ['categoria_veiculo', 'Categoria'], ['motorista', 'Motorista'],
        ['data', 'Data'], ['hora', 'Hora'], ['origem', 'Origem'], ['destino', 'Destino'],
        ['passageiros', 'Pax'], ['quantidade', 'Qtde'],
      ].filter(([campo]) => itens.some(it => it[campo] !== null && it[campo] !== undefined && it[campo] !== ''));
      let head = '';
      for (const [, rotulo] of colunas) head += '<th>' + rotulo + '</th>';
      let linhas = '';
      for (const it of itens) {
        linhas += '<tr>';
        for (const [campo] of colunas) linhas += '<td>' + vazio(it[campo]) + '</td>';
        linhas += '</tr>';
      }
      let pend = '';
      for (const p of (r.incompletude || [])) pend += '<li>' + escapeHtml(p) + '</li>';

      out.innerHTML =
        '<div class="card"><h2>Tipo de mensagem</h2><div class="linha">' + vazio(r.tipo_mensagem) + '</div></div>' +
        '<div class="card"><h2>Cliente</h2>' +
          '<div class="linha"><b>Cliente:</b> ' + vazio(r.cliente_nome) + '</div>' +
          '<div class="linha"><b>Contato:</b> ' + vazio(r.contato_nome) + '</div>' +
          '<div class="linha"><b>E-mail:</b> ' + vazio(r.email) + '</div>' +
          '<div class="linha"><b>Telefone:</b> ' + vazio(r.telefone) + '</div>' +
          '<div class="linha"><b>Idioma:</b> ' + vazio(r.idioma) + '</div></div>' +
        '<div class="card"><h2>Itens</h2><table><thead><tr>' + head +
          '</tr></thead><tbody>' + linhas + '</tbody></table></div>' +
        '<div class="card"><h2>Observações</h2><div class="linha">' + vazio(r.observacoes) + '</div></div>' +
        '<div class="card"><h2>Para completar (incompletude)</h2><ul class="pend">' + (pend || '<li class="vazio">nada pendente</li>') + '</ul></div>';
      out.style.display = 'block';
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
