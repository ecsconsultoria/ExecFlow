{% extends "base.html" %}
{% block title %}{{ 'Editar' if driver else 'Novo' }} Motorista{% endblock %}
{% block page_title %}
  <a href="{{ url_for('drivers.index') }}" class="text-slate-400 hover:text-blue-500 mr-2 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
  {{ 'Editar' if driver else 'Novo' }} Motorista
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6">
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nome *</label>
      <input name="name" required value="{{ driver.name if driver else '' }}"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Telefone</label>
        <input name="phone" value="{{ driver.phone if driver else '' }}"
               class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
        <input type="email" name="email" value="{{ driver.email if driver else '' }}"
               class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Idioma</label>
      <select name="language" class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
        <option value="monolingual" {% if driver and driver.language == 'monolingual' %}selected{% endif %}>Português</option>
        <option value="bilingual"   {% if driver and driver.language == 'bilingual'   %}selected{% endif %}>Bilíngue (EN)</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Fornecedor (opcional)</label>
      <select name="supplier_id" class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
        <option value="">– Motorista interno –</option>
        {% for s in suppliers %}
        <option value="{{ s.id }}" {% if driver and driver.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CNH</label>
      <input name="license_number" value="{{ driver.license_number if driver else '' }}"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300 cursor-pointer">
      <input type="checkbox" name="is_active" value="1"
             {% if (not driver) or driver.is_active %}checked{% endif %}
             class="rounded border-slate-300">
      Ativo
    </label>
    <div class="flex justify-end gap-3 pt-2">
      <a href="{{ url_for('drivers.index') }}"
         class="px-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded-lg">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
