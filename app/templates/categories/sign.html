{% extends "base.html" %}
{% block title %}Placa de Receptivo{% endblock %}
{% block page_title %}<i class="fa-solid fa-sign-hanging mr-2 text-violet-500"></i>Placa de Receptivo{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm overflow-hidden">
    <div class="px-4 py-2.5 border-b border-slate-100 dark:border-slate-700">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
        <i class="fa-solid fa-sign-hanging mr-2 text-violet-500"></i>Nova Placa
      </p>
    </div>
    <form method="post" enctype="multipart/form-data" class="px-4 py-4 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="flex items-end gap-3 flex-wrap">
        <div class="flex-1 min-w-[200px]">
          <label class="lbl">Texto da Placa</label>
          <input type="text" name="sign_text" class="fi"
                 placeholder="Ex: MR VIVIANE">
        </div>
        <div>
          <label class="lbl">Imagem</label>
          <label class="inline-flex items-center gap-1.5 px-3 py-[7px] text-xs rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-500 hover:text-violet-500 hover:border-violet-400 cursor-pointer whitespace-nowrap transition-colors">
            <i class="fa-regular fa-image text-[11px]"></i> Selecionar
            <input type="file" name="sign_image" accept="image/png,image/jpeg" class="hidden">
          </label>
        </div>
        <div>
          <label class="lbl">Posição</label>
          <div class="flex items-center gap-3 h-[34px]">
            <label class="inline-flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300 cursor-pointer whitespace-nowrap">
              <input type="radio" name="sign_img_pos" value="abaixo" checked
                     class="text-violet-600 focus:ring-violet-500"> Abaixo
            </label>
            <label class="inline-flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300 cursor-pointer whitespace-nowrap">
              <input type="radio" name="sign_img_pos" value="centro"
                     class="text-violet-600 focus:ring-violet-500"> Centro
            </label>
          </div>
        </div>
      </div>

      <div class="flex gap-2 justify-end pt-1 border-t border-slate-100 dark:border-slate-700">
        <button type="reset"
                class="h-8 px-3 text-xs font-medium rounded-lg inline-flex items-center gap-1.5 transition-colors bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600">
          Limpar
        </button>
        <button type="submit"
                class="h-8 px-4 text-xs font-medium rounded-lg inline-flex items-center gap-1.5 transition-colors bg-violet-600 hover:bg-violet-700 text-white">
          <i class="fa-solid fa-file-pdf text-[11px]"></i> Gerar PDF
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
