{% extends "base.html" %}
{% block title %}{{ 'Editar' if client else 'Novo' }} Cliente{% endblock %}
{% block page_title %}
  <a href="{{ url_for('clients.index') }}" class="text-slate-400 hover:text-blue-500 mr-2 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
  {{ 'Editar' if client else 'Novo' }} Cliente
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6">
  <form method="post">
    <div class="grid grid-cols-2 gap-x-8 gap-y-4">

      <!-- Coluna Esquerda -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Empresa / Cliente *</label>
          <input type="text" name="name" required
                 value="{{ client.name if client and client.name else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nome do Contato</label>
          <input type="text" name="contact"
                 value="{{ client.contact if client and client.contact else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">CPF/CNPJ</label>
          <input type="text" name="document"
                 value="{{ client.document if client and client.document else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Tipo</label>
          <select name="client_type" class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
            <option value="pf" {% if client and client.client_type == 'pf' %}selected{% endif %}>Pessoa Física</option>
            <option value="pj" {% if client and client.client_type == 'pj' %}selected{% endif %}>Pessoa Jurídica</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
          <input type="email" name="email"
                 value="{{ client.email if client and client.email else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Coluna Direita -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Telefone</label>
          <input type="text" name="phone"
                 value="{{ client.phone if client and client.phone else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Celular</label>
          <input type="text" name="whatsapp"
                 value="{{ client.whatsapp if client and client.whatsapp else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Endereço</label>
          <input type="text" name="address"
                 value="{{ client.address if client and client.address else '' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Cidade</label>
            <input type="text" name="city"
                   value="{{ client.city if client and client.city else '' }}"
                   class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Estado</label>
            <input type="text" name="state" maxlength="10"
                   value="{{ client.state if client and client.state else '' }}"
                   class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">País</label>
          <input type="text" name="country"
                 value="{{ client.country if client and client.country else 'Brasil' }}"
                 class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

    </div>

    <!-- Botões -->
    <div class="flex justify-end gap-3 pt-5 mt-2 border-t border-slate-100 dark:border-slate-700">
      <a href="{{ url_for('clients.index') }}"
         class="px-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded-lg">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
