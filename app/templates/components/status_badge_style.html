{# status_badge_style.html — Componente compartilhado de badge de status (redesign premium).
   Uso: incluir em extra_head e aplicar as classes:
   <span class="status-badge status-badge--<variante>"><span class="status-badge__dot"></span>LABEL</span>
   Variantes: open / invoiced / completed / pending / cancelled.
   Para novos status, adicione apenas uma nova variante abaixo. #}
<style>
  .status-badge{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    width:104px;                  /* largura fixa — todas as caixas no mesmo tamanho */
    padding:3px 10px 3px 8px;     /* mesmo box dos badges padrão do sistema */
    border-radius:6px; border:1.5px solid transparent;
    font-size:10.5px; font-weight:700; line-height:normal;
    letter-spacing:.07em; text-transform:uppercase;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .status-badge__dot{
    width:6px; height:6px; border-radius:50%; flex-shrink:0;
  }

  /* ── Light mode ── */
  .status-badge--open{
    background:rgba(37,99,235,.06); border-color:rgba(37,99,235,.16); color:#2563eb;
  }
  .status-badge--open .status-badge__dot{background:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.10)}

  .status-badge--invoiced{
    background:rgba(217,119,6,.06); border-color:rgba(217,119,6,.16); color:#b45309;
  }
  .status-badge--invoiced .status-badge__dot{background:#d97706; box-shadow:0 0 0 3px rgba(217,119,6,.10)}

  .status-badge--completed{
    background:rgba(5,150,105,.06); border-color:rgba(5,150,105,.16); color:#047857;
  }
  .status-badge--completed .status-badge__dot{background:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.10)}

  .status-badge--pending{
    background:rgba(100,116,139,.06); border-color:rgba(100,116,139,.16); color:#64748b;
  }
  .status-badge--pending .status-badge__dot{background:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,.10)}

  .status-badge--cancelled{
    background:rgba(225,29,72,.05); border-color:rgba(225,29,72,.13); color:#be123c;
  }
  .status-badge--cancelled .status-badge__dot{background:#f43f5e; box-shadow:0 0 0 3px rgba(244,63,94,.08)}

  /* ── Dark mode ── */
  .dark .status-badge--open{
    background:rgba(96,165,250,.09); border-color:rgba(96,165,250,.17); color:#93c5fd;
  }
  .dark .status-badge--open .status-badge__dot{background:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,.12)}

  .dark .status-badge--invoiced{
    background:rgba(251,191,36,.09); border-color:rgba(251,191,36,.17); color:#fcd34d;
  }
  .dark .status-badge--invoiced .status-badge__dot{background:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.12)}

  .dark .status-badge--completed{
    background:rgba(52,211,153,.09); border-color:rgba(52,211,153,.17); color:#6ee7b7;
  }
  .dark .status-badge--completed .status-badge__dot{background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.12)}

  .dark .status-badge--pending{
    background:rgba(148,163,184,.09); border-color:rgba(148,163,184,.17); color:#cbd5e1;
  }
  .dark .status-badge--pending .status-badge__dot{background:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,.12)}

  .dark .status-badge--cancelled{
    background:rgba(251,113,133,.09); border-color:rgba(251,113,133,.17); color:#fda4af;
  }
  .dark .status-badge--cancelled .status-badge__dot{background:#fb7185; box-shadow:0 0 0 3px rgba(251,113,133,.12)}
</style>
