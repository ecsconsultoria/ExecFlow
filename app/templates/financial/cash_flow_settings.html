{% extends "base.html" %}
{% block title %}Saldo Inicial{% endblock %}
{% block page_title %}
  <a href="{{ url_for('financial.cash_flow') }}" class="text-slate-400 hover:text-blue-500 mr-2 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
  Saldo Inicial
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6">
  <form method="post" action="{{ url_for('financial.cash_flow_settings') }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-900 rounded-lg px-4 py-3 text-sm text-amber-800 dark:text-amber-200 mb-4">
      <i class="fa-solid fa-circle-info mr-1"></i>
      Este valor representa o saldo de caixa existente na data informada. Ele não será calculado automaticamente pelo sistema.
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Saldo inicial (R$) *</label>
      <input type="number" name="cash_initial_balance" step="0.01" min="0" required
             value="{{ '%.2f'|format(value) if value else '' }}"
             placeholder="0,00"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Data de referência *</label>
      <input type="date" name="cash_initial_balance_date" required
             value="{{ ref_date.isoformat() if ref_date else today.isoformat() }}"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('financial.cash_flow') }}"
         class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
      <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
