{% extends "base.html" %}
{% block title %}{{ 'Editar' if cat else 'Nova' }} Categoria Financeira{% endblock %}
{% block page_title %}
  <a href="{{ url_for('financial.categories') }}" class="text-slate-400 hover:text-blue-500 mr-2 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
  {{ 'Editar' if cat else 'Nova' }} Categoria Financeira
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6">
  <form method="post"
        action="{{ url_for('financial.edit_category', cid=cat.id) if cat else url_for('financial.new_category') }}"
        class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nome *</label>
      <input type="text" name="name" required value="{{ cat.name if cat else '' }}"
             placeholder="Ex: Aluguel"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Tipo *</label>
      <select name="type" required
              class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        {% for t in types %}
        <option value="{{ t }}" {{ 'selected' if cat and cat.type == t }}>
          {{ labels.get(t, t) }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Categoria pai</label>
      <select name="parent_id"
              class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">– Sem pai (raiz) –</option>
        {% for p in parents %}
        <option value="{{ p.id }}" {{ 'selected' if cat and cat.parent_id == p.id }}>
          {{ p.name }} ({{ labels.get(p.type, p.type) }})
        </option>
        {% endfor %}
      </select>
      <p class="text-xs text-slate-400 mt-1">O pai deve ser do mesmo tipo da categoria.</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Descrição</label>
      <input type="text" name="description" value="{{ cat.description if cat and cat.description else '' }}"
             placeholder="Opcional"
             class="w-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('financial.categories') }}"
         class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
      <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
