{% extends "base.html" %}
{% block title %}Trocar senha{% endblock %}
{% block page_title %}<i class="fa-solid fa-key mr-2 text-amber-500"></i>Trocar senha{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 mt-6">
  {% if force %}
  <div class="mb-4 p-3 rounded bg-amber-50 border border-amber-200 text-amber-700 text-sm">
    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
    É necessário trocar sua senha antes de continuar.
  </div>
  {% endif %}
  <form method="post" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Senha atual</label>
      <input type="password" name="current_password" required
             class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Nova senha</label>
      <input type="password" name="new_password" minlength="6" required
             class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Confirmar nova senha</label>
      <input type="password" name="confirm_password" minlength="6" required
             class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-sm">
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
      Atualizar senha
    </button>
  </form>
</div>
{% endblock %}
