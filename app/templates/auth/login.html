<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Executive Car SP ERP v4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-2xl p-8">
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mb-4">
        <i class="fa-solid fa-car text-white text-2xl"></i>
      </div>
      <h1 class="text-white text-xl font-bold">Executive Car SP</h1>
      <p class="text-slate-400 text-sm mt-1">ERP v4 — Acesso ao sistema</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="mb-4 p-3 rounded-lg text-sm
      {% if cat == 'error' %}bg-red-900/50 text-red-300{% else %}bg-blue-900/50 text-blue-300{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
    {% endwith %}

    <form method="post" class="space-y-4">
      <div>
        <label class="block text-slate-300 text-sm mb-1">E-mail</label>
        <input type="email" name="email" required
               class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-slate-300 text-sm mb-1">Senha</label>
        <input type="password" name="password" required
               class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="••••••••">
      </div>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg px-4 py-2.5 text-sm transition-colors">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
